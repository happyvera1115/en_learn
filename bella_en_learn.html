      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }

    }

    }

    }

    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playPop() {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch (e) {}
      }
      playRemove() {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(260, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch (e) {}
      }
      playSuccess() {
        try {
          this.init();
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            const startTime = this.ctx.currentTime + idx * 0.1;
            gain.gain.setValueAtTime(0.3, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.35);
          });
        } catch (e) {}
      }
      playTryAgain() {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, this.ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(240, this.ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.25);
        } catch (e) {}
      }
    }

    // 3. 原生彩色灑花特效

    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];

      for (let i = 0; i < 110; i++) {
        particles.push({
          x: canvas.width * (0.2 + Math.random() * 0.6),
          y: canvas.height * 0.5,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.8) * 18,
          size: 6 + Math.random() * 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 12,
          gravity: 0.45,
          opacity: 1
        });
      }

      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.rotation += p.rotationSpeed;
          p.opacity -= 0.009;

          if (p.opacity > 0 && p.y < canvas.height) {
            alive = true;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.opacity);
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            ctx.restore();
          }
        });

        frame++;
        if (alive && frame < 180) {
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      animate();
    }

    class SpellingApp {
      constructor() {
        this.allWords = [...allWords];
        this.currentWeek = 'week1';
        this.currentDay = 'day1'; // 'day1', 'day2', ... , 'review', 'unlearned'
        this.currentUser = 'Bella';
        this.profiles = this.loadProfiles();
        this.words = this.getFilteredWords();
        this.currentIndex = 0;
        
        this.slots = [];
        this.letterPool = [];
        this.isSolved = false;
        this.speechSequenceToken = 0;

        this.cacheDom();
        this.renderWeekTabs();
        this.renderDayTabs();
        this.bindEvents();
        this.renderProfile();
        this.loadWord(0);
      }

      getDisplayWord(wordData) {
        if (!wordData) return '';
        if (wordData.isProperNoun) return wordData.word;
        return wordData.word.toLowerCase();
      }

      speak(text, rate = 0.85, onEnd = null) {
        if (!('speechSynthesis' in window)) {
          if (onEnd) onEnd();
          return;
        }
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = rate;
        if (onEnd) {
          u.onend = () => onEnd();
          u.onerror = () => onEnd();
        }
        window.speechSynthesis.speak(u);
      }

      speakZh(text, onEnd = null) {
        if (!('speechSynthesis' in window)) {
          if (onEnd) onEnd();
          return;
        }
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-TW';
        u.rate = 1.0;
        if (onEnd) {
          u.onend = () => onEnd();
          u.onerror = () => onEnd();
        }
        window.speechSynthesis.speak(u);
      }

      speakSentence(sentence, onEnd = null) {
        if (!sentence) return;
        this.speak(sentence, 0.82, onEnd);
      }

      speakSpelling(word) {
        if (!word) return;
        const letters = word.split('');
        let i = 0;
        const speakNext = () => {
          if (i < letters.length) {
            this.speak(letters[i], 0.75, () => {
              i++;
              setTimeout(speakNext, 120);
            });
          }
        };
        speakNext();
      }

      playBilingualTwice(word, translation, onEnd = null) {
        if (!('speechSynthesis' in window)) {
          if (onEnd) onEnd();
          return;
        }
        window.speechSynthesis.cancel();
        const currentToken = ++this.speechSequenceToken;

        this.speak(word, 0.85, () => {
          if (this.speechSequenceToken !== currentToken) return;
          setTimeout(() => {
            if (this.speechSequenceToken !== currentToken) return;
            this.speakZh(translation, () => {
              if (this.speechSequenceToken !== currentToken) return;
              setTimeout(() => {
                if (this.speechSequenceToken !== currentToken) return;
                this.speak(word, 0.85, () => {
                  if (this.speechSequenceToken !== currentToken) return;
                  setTimeout(() => {
                    if (this.speechSequenceToken !== currentToken) return;
                    this.speakZh(translation, onEnd);
                  }, 200);
                });
              }, 300);
            });
          }, 200);
        });
      }

      shuffleArray(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      getFilteredWords() {
        const profile = this.profiles[this.currentUser] || { completed: {} };
        const completedMap = profile.completed || {};

        const weekWords = this.allWords.filter(w => w.week === this.currentWeek);

        if (this.currentDay === 'review') {
          return [...weekWords];
        }

        if (this.currentDay === 'unlearned') {
          return weekWords.filter(w => !completedMap[w.id]);
        }

        return weekWords.filter(w => w.day === this.currentDay);
      }

      shuffleCurrentQuestions() {
        sfx.playPop();
        this.words = this.shuffleArray(this.words);
        this.currentIndex = 0;
        this.loadWord(0);
      }

      loadProfiles() {
        const saved = localStorage.getItem('bella_spelling_profile_v4');
        if (saved) {
          try {
            return JSON.parse(saved);
          } catch (e) {}
        }
        return {
          Bella: { name: 'Bella', avatar: '👧', stars: 0, completed: {}, history: [] }
        };
      }

      saveProfiles() {
        localStorage.setItem('bella_spelling_profile_v4', JSON.stringify(this.profiles));
      }

          wordSentenceDisplay: document.getElementById('word-sentence-display'),

          feedbackSubtitle: document.getElementById('feedback-subtitle'),

          feedbackWordBox: document.getElementById('feedback-word-box'),
          feedbackWordImg: document.getElementById('feedback-word-img'),
          feedbackSpellingTiles: document.getElementById('feedback-spelling-tiles'),
          feedbackWordText: document.getElementById('feedback-word-text'),

          feedbackWordPhonics: document.getElementById('feedback-word-phonics'),
          feedbackCompleteSentence: document.getElementById('feedback-complete-sentence'),
          feedbackBtnSpell: document.getElementById('feedback-btn-spell'),

        };

      // 渲染第 1 層：週次選單
      renderWeekTabs() {
        if (!this.dom.weekTabs) return;
        this.dom.weekTabs.innerHTML = '';

        const profile = this.profiles[this.currentUser] || { completed: {} };

        weeksConfig.forEach(week => {
          const btn = document.createElement('button');
          btn.type = 'button';
          const isActive = this.currentWeek === week.id;

          const weekWordList = this.allWords.filter(w => w.week === week.id);
          const masteredCount = weekWordList.filter(w => !!profile.completed[w.id]).length;
          const totalCount = weekWordList.length;

          btn.className = `flex items-center gap-1 px-3 py-1 sm:py-1.5 rounded-full font-bold text-xs sm:text-sm transition-all duration-200 ${
            isActive 
              ? 'bg-pink-600 text-white shadow-md scale-105 ring-2 ring-pink-300' 
              : 'bg-white/85 hover:bg-white text-slate-700 shadow-xs border border-slate-200 hover:scale-102'
          }`;

          btn.innerHTML = `<span>${week.icon}</span><span>${week.name}</span><span class="text-[10px] sm:text-xs opacity-80 font-normal">(${masteredCount}/${totalCount})</span>`;
          btn.addEventListener('click', () => {
            sfx.playPop();
            this.currentWeek = week.id;
            // 預設切換到該週的 day1
            this.currentDay = 'day1';
            this.words = this.getFilteredWords();
            this.renderWeekTabs();
            this.renderDayTabs();
            this.currentIndex = 0;
            this.loadWord(0);
          });
          this.dom.weekTabs.appendChild(btn);
        });
      }

      // 渲染第 2 層：天數選單 (依週次自適應實際天數：第1週4天，其他5天，第5週3天)
      renderDayTabs() {
        if (!this.dom.dayTabs) return;
        this.dom.dayTabs.innerHTML = '';

        const profile = this.profiles[this.currentUser] || { completed: {} };
        const weekWordList = this.allWords.filter(w => w.week === this.currentWeek);
        const currentWeekConfig = weeksConfig.find(w => w.id === this.currentWeek) || weeksConfig[0];

        // 收集該週所有的有效天數
        const daysList = currentWeekConfig.days;

        daysList.forEach(dayId => {
          const btn = document.createElement('button');
          btn.type = 'button';
          const isActive = this.currentDay === dayId;

          const dWords = weekWordList.filter(w => w.day === dayId);
          const m = dWords.filter(w => !!profile.completed[w.id]).length;
          const label = dWords[0]?.dayLabel || dayId;

          btn.className = `flex items-center gap-1 px-2.5 py-0.5 sm:py-1 rounded-full font-bold text-[11px] sm:text-xs transition-all duration-200 ${
            isActive 
              ? 'bg-indigo-600 text-white shadow-sm ring-2 ring-indigo-200 scale-102' 
              : 'bg-white/70 hover:bg-white text-slate-600 shadow-2xs border border-slate-200/80 hover:text-slate-800'
          }`;

          btn.innerHTML = `<span>📅</span><span>${label}</span><span class="text-[10px] opacity-80">(${m}/${dWords.length})</span>`;
          btn.addEventListener('click', () => {
            sfx.playPop();
            this.currentDay = dayId;
            this.words = this.getFilteredWords();
            this.renderDayTabs();
            this.currentIndex = 0;
            this.loadWord(0);
          });
          this.dom.dayTabs.appendChild(btn);
        });

        // 加入「整週總複習」按鈕
        const reviewBtn = document.createElement('button');
        reviewBtn.type = 'button';
        const isReviewActive = this.currentDay === 'review';
        const reviewMastered = weekWordList.filter(w => !!profile.completed[w.id]).length;

        reviewBtn.className = `flex items-center gap-1 px-2.5 py-0.5 sm:py-1 rounded-full font-bold text-[11px] sm:text-xs transition-all duration-200 ${
          isReviewActive 
            ? 'bg-purple-600 text-white shadow-sm ring-2 ring-purple-200 scale-102' 
            : 'bg-purple-50 hover:bg-purple-100 text-purple-700 shadow-2xs border border-purple-200'
        }`;
        reviewBtn.innerHTML = `<span>🏆</span><span>整週總複習</span><span class="text-[10px] opacity-80">(${reviewMastered}/${weekWordList.length})</span>`;
        reviewBtn.addEventListener('click', () => {
          sfx.playPop();
          this.currentDay = 'review';
          this.words = this.getFilteredWords();
          this.renderDayTabs();
          this.currentIndex = 0;
          this.loadWord(0);
        });
        this.dom.dayTabs.appendChild(reviewBtn);

        // 加入「尚未學過」按鈕
        const unlearnedWords = weekWordList.filter(w => !profile.completed[w.id]);
        const unlearnedBtn = document.createElement('button');
        unlearnedBtn.type = 'button';
        const isUnlearnedActive = this.currentDay === 'unlearned';

        unlearnedBtn.className = `flex items-center gap-1 px-2.5 py-0.5 sm:py-1 rounded-full font-bold text-[11px] sm:text-xs transition-all duration-200 ${
          isUnlearnedActive 
            ? 'bg-amber-600 text-white shadow-sm ring-2 ring-amber-200 scale-102' 
            : 'bg-amber-50 hover:bg-amber-100 text-amber-800 shadow-2xs border border-amber-200'
        }`;
        unlearnedBtn.innerHTML = `<span>🎯</span><span>尚未學過</span><span class="text-[10px] bg-amber-200 text-amber-900 font-bold px-1.5 rounded-full">${unlearnedWords.length}</span>`;
        unlearnedBtn.addEventListener('click', () => {
          sfx.playPop();
          this.currentDay = 'unlearned';
          this.words = this.getFilteredWords();
          this.renderDayTabs();
          this.currentIndex = 0;
          this.loadWord(0);
        });
        this.dom.dayTabs.appendChild(unlearnedBtn);
      }

      // 核心推進邏輯：當天跳完了，直接跳第二天，絕不重複！
      handleNextWord() {
        if (this.currentIndex + 1 < this.words.length) {
          // 當前天數還有單字，繼續下一題
          this.currentIndex++;
          this.loadWord(this.currentIndex);
        } else {
          // 當天單字已全數完成！直接晉級到下一天！
          this.advanceToNextDay();
        }
      }

      advanceToNextDay() {
        const currentWeekConfig = weeksConfig.find(w => w.id === this.currentWeek);
        const daysList = currentWeekConfig.days; // 例如 ['day1', 'day2', 'day3', 'day4']
        const currentDayIndex = daysList.indexOf(this.currentDay);

        if (currentDayIndex !== -1 && currentDayIndex < daysList.length - 1) {
          // 還有下一天 (例如 day1 -> day2)
          const nextDayId = daysList[currentDayIndex + 1];
          this.currentDay = nextDayId;
          this.words = this.getFilteredWords();
          this.renderDayTabs();
          this.currentIndex = 0;

          sfx.playSuccess();
          launchConfetti();

          const dayLabel = this.words[0]?.dayLabel || '下一天';
          this.speakZh(`太棒了！直接進入 ${dayLabel}！`);
          this.loadWord(0);
        } else if (currentDayIndex === daysList.length - 1) {
          // 當週所有天數完成，直接跳整週總複習
          this.currentDay = 'review';
          this.words = this.getFilteredWords();
          this.renderDayTabs();
          this.currentIndex = 0;

          sfx.playSuccess();
          launchConfetti();
          this.speakZh(`太厲害了！本週天數全過關！進入整週總複習！`);
          this.loadWord(0);
        } else if (this.currentDay === 'review') {
          // 整週總複習也做完了，前進下一週
          const currentWeekIndex = weeksConfig.findIndex(w => w.id === this.currentWeek);
          if (currentWeekIndex !== -1 && currentWeekIndex < weeksConfig.length - 1) {
            const nextWeek = weeksConfig[currentWeekIndex + 1];
            this.currentWeek = nextWeek.id;
            this.currentDay = 'day1';
            this.words = this.getFilteredWords();
            this.renderWeekTabs();
            this.renderDayTabs();
            this.currentIndex = 0;

            sfx.playSuccess();
            launchConfetti();
            this.speakZh(`太強了！整週總複習全數通關！前進 ${nextWeek.name}！`);
            this.loadWord(0);
          } else {
            this.renderAllDoneState();
          }
        } else {
          this.renderAllDoneState();
        }
      }

      bindEvents() {
        this.dom.speakBtn.addEventListener('click', () => {
          sfx.playPop();
          const w = this.getCurrentWord();
          this.playBilingualTwice(w.word, w.translation);
        });
        this.dom.speakSlowBtn.addEventListener('click', () => this.speak(this.getCurrentWord().word, 0.55));
        
        this.dom.speakSentenceBtn?.addEventListener('click', () => {
          sfx.playPop();
          const w = this.getCurrentWord();
          this.speakSentence(w.sentenceComplete || w.sentence);
        });

        this.dom.resetLettersBtn.addEventListener('click', () => this.resetCurrentBoard());
        this.dom.hintBtn.addEventListener('click', () => this.giveHint());
        this.dom.prevWordBtn.addEventListener('click', () => this.prevWord());
        this.dom.nextWordBtn.addEventListener('click', () => {
          sfx.playPop();
          this.handleNextWord();
        });
        this.dom.shuffleWordsBtn?.addEventListener('click', () => this.shuffleCurrentQuestions());

        this.dom.statsModalBtn.addEventListener('click', () => this.showStats());
        this.dom.closeStatsBtn.addEventListener('click', () => this.hideStats());
        this.dom.statsModal.addEventListener('click', (e) => {
          if (e.target === this.dom.statsModal) this.hideStats();
        });

        // 答對彈窗發音按鈕
        this.dom.feedbackBtnSpell?.addEventListener('click', () => {
          sfx.playPop();
          this.speakSpelling(this.getCurrentWord().word);
        });
        this.dom.feedbackBtnEn?.addEventListener('click', () => {
          sfx.playPop();
          this.speak(this.getCurrentWord().word, 0.85);
        });
        this.dom.feedbackBtnSentence?.addEventListener('click', () => {
          sfx.playPop();
          const w = this.getCurrentWord();
          this.speakSentence(w.sentenceComplete || w.sentence);
        });
        this.dom.feedbackBtnZh?.addEventListener('click', () => {
          sfx.playPop();
          this.speakZh(this.getCurrentWord().translation);
        });

        this.dom.feedbackActionBtn.addEventListener('click', () => {
          window.speechSynthesis?.cancel();
          this.speechSequenceToken++;
          this.dom.feedbackCard.classList.add('hidden');
          if (this.isSolved) {
            if (this.currentDay === 'unlearned') {
              this.words = this.getFilteredWords();
              this.renderWeekTabs();
              this.renderDayTabs();
              if (this.words.length === 0) {
                this.loadWord(0);
                return;
              }
              if (this.currentIndex >= this.words.length) {
                this.currentIndex = 0;
              }
              this.loadWord(this.currentIndex);
            } else {
              this.handleNextWord();
            }
          }
        });
      }

      renderProfile() {
        const profile = this.profiles[this.currentUser] || { name: 'Bella', stars: 0 };
        if (this.dom.userStarsEl) this.dom.userStarsEl.textContent = profile.stars;
      }

      getCurrentWord() {
        return this.words[this.currentIndex] || this.words[0];
      }

      renderAllDoneState() {
        this.currentIndex = 0;
        this.isSolved = true;
        this.dom.wordTranslation.textContent = "全數通關！";
        this.dom.wordPhonics.textContent = "Great Job, Bella! 🌟";
        this.dom.wordHint.textContent = `太強了！Bella 已經掌握此單元所有單字！可以選其他天數或整週總複習喔！`;
        this.dom.wordCounter.textContent = `0 / 0`;
        this.dom.wordSentenceDisplay.textContent = "所有文意字彙已通關完成！";
        this.dom.wordNoteText.textContent = "完美達成";
        this.dom.wordImg.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="%23fef08a"/><path d="M50 18 L59 36 L79 39 L64 53 L68 73 L50 63 L32 73 L36 53 L21 39 L41 36 Z" fill="%23f59e0b"/><circle cx="50" cy="46" r="6" fill="%23fff"/></svg>`;
        this.dom.slotsContainer.innerHTML = `<div class="text-indigo-700 font-extrabold text-sm bg-indigo-50 border border-indigo-200 px-4 py-2 rounded-2xl">🎉 太棒了！此單元所有單字全部過關囉！</div>`;
        this.dom.lettersPoolContainer.innerHTML = `<div class="text-slate-400 font-bold text-xs py-2">點選上方按鈕隨時切換天數或整週總複習</div>`;
        const completedBadge = document.getElementById('word-completed-badge');
        if (completedBadge) completedBadge.classList.add('hidden');
        launchConfetti();
        this.speakZh(`太厲害了，Bella！所有單字都已經學會了！`);
      }

      loadWord(index) {
        if (!this.words || this.words.length === 0) {
          this.renderAllDoneState();
          return;
        }
        if (index < 0) index = 0;
        if (index >= this.words.length) index = 0;
        this.currentIndex = index;
        this.isSolved = false;

        const wordData = this.getCurrentWord();
        const wordClean = this.getDisplayWord(wordData);

        // 圖片渲染
        if (wordData.image && !wordData.image.startsWith('<svg') && !wordData.image.startsWith('data:')) {
          const fallback = wordData.fallbackImage || '';
          this.dom.wordImg.innerHTML = `<img src="${wordData.image}" alt="${wordData.translation}" onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.dataset.fb=''}else{this.onerror=null;}" data-fb="${fallback}" class="w-full h-full object-cover rounded-2xl shadow-sm" />`;
        } else if (wordData.image && wordData.image.startsWith('data:image/svg+xml;utf8,')) {
          this.dom.wordImg.innerHTML = decodeURIComponent(wordData.image.replace('data:image/svg+xml;utf8,', ''));
        } else if (wordData.image && wordData.image.startsWith('<svg')) {
          this.dom.wordImg.innerHTML = wordData.image;
        } else if (wordData.image) {
          this.dom.wordImg.innerHTML = `<img src="${wordData.image}" alt="${wordData.translation}" class="w-full h-full object-cover rounded-2xl shadow-sm" />`;
        }

        this.dom.wordTranslation.textContent = wordData.translation;
        this.dom.wordPhonics.textContent = wordData.phonics || '';
        this.dom.wordHint.textContent = wordData.hint || '';
        this.dom.wordCounter.textContent = `${this.currentIndex + 1} / ${this.words.length}`;
        this.dom.feedbackCard.classList.add('hidden');

        if (this.dom.wordNoteText) {
          this.dom.wordNoteText.textContent = wordData.note || `【${wordData.dayLabel || '大英9月號'}】`;
        }
        if (this.dom.wordSentenceDisplay) {
          let sentText = wordData.sentence || wordData.sentenceComplete || '';
          const clue = wordData.clue || '';
          if (clue && sentText.includes(clue)) {
            sentText = sentText.replace(clue, `<span class="bg-amber-200/90 text-amber-950 px-2 py-0.5 rounded-md font-mono font-black border border-amber-300 shadow-xs">${clue}</span>`);
          }
          this.dom.wordSentenceDisplay.innerHTML = sentText;
        }

        const isCompleted = !!this.profiles[this.currentUser].completed[wordData.id];
        const completedBadge = document.getElementById('word-completed-badge');
        if (completedBadge) {
          completedBadge.classList.toggle('hidden', !isCompleted);
        }

        this.slots = new Array(wordClean.length).fill(null);

        const chars = wordClean.split('');
        const lettersWithId = chars.map((ch, idx) => ({ id: idx, char: ch, used: false }));
        
        let shuffled;
        let attempts = 0;
        do {
          shuffled = [...lettersWithId].sort(() => Math.random() - 0.5);
          attempts++;
        } while (shuffled.map(l => l.char).join('') === wordClean && chars.length > 2 && attempts < 10);

        this.letterPool = shuffled;
        this.renderBoard();

        setTimeout(() => {
          const sentenceToRead = wordData.sentenceComplete || wordData.sentence;
          if (sentenceToRead) {
            this.speakSentence(sentenceToRead);
          } else {
            this.playBilingualTwice(wordData.word, wordData.translation);
          }
        }, 300);
      }

      renderBoard() {
        this.renderSlots();
        this.renderPool();
      }

      renderSlots() {
        this.dom.slotsContainer.innerHTML = '';
        const isLong = this.slots.length > 7;
        const sizeClass = isLong
          ? "w-11 h-14 sm:w-13 sm:h-16 md:w-14 md:h-18 lg:w-16 lg:h-20 text-xl sm:text-2xl md:text-3xl font-black rounded-2xl"
          : "w-13 h-16 sm:w-15 sm:h-18 md:w-16 md:h-20 lg:w-20 lg:h-24 text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-black rounded-2xl sm:rounded-3xl";

        this.slots.forEach((slotItem, slotIndex) => {
          const slotEl = document.createElement('div');
          slotEl.className = `${sizeClass} flex items-center justify-center shadow-inner transition-all duration-200 cursor-pointer select-none ${
            slotItem 
              ? 'bg-amber-300 text-amber-950 border-3 sm:border-4 border-amber-400 shadow-md transform active:scale-95' 
              : 'bg-white/85 border-3 sm:border-4 border-dashed border-sky-300 text-transparent hover:border-sky-400'
          }`;
          slotEl.dataset.slotIndex = slotIndex;

          if (slotItem) {
            slotEl.textContent = slotItem.char;
            slotEl.addEventListener('click', () => {
              if (this.isSolved) return;
              this.removeLetterFromSlot(slotIndex);
            });
          } else {
            slotEl.innerHTML = `<span class="text-sky-200 text-base sm:text-lg md:text-xl font-bold">${slotIndex + 1}</span>`;
          }

          slotEl.addEventListener('dragover', (e) => {
            e.preventDefault();
            slotEl.classList.add('bg-amber-100', 'border-amber-400');
          });
          slotEl.addEventListener('dragleave', () => {
            slotEl.classList.remove('bg-amber-100', 'border-amber-400');
          });
          slotEl.addEventListener('drop', (e) => {
            e.preventDefault();
            slotEl.classList.remove('bg-amber-100', 'border-amber-400');
            const poolId = parseInt(e.dataTransfer.getData('text/plain'), 10);
            if (!isNaN(poolId)) {
              this.placeLetterInSlot(poolId, slotIndex);
            }
          });

          this.dom.slotsContainer.appendChild(slotEl);
        });
      }

      renderPool() {
        this.dom.lettersPoolContainer.innerHTML = '';
        const isLong = this.letterPool.length > 7;
        const sizeClass = isLong
          ? "w-11 h-14 sm:w-13 sm:h-16 md:w-14 md:h-18 lg:w-16 lg:h-20 text-xl sm:text-2xl md:text-3xl font-black rounded-2xl"
          : "w-13 h-16 sm:w-15 sm:h-18 md:w-16 md:h-20 lg:w-20 lg:h-24 text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-black rounded-2xl sm:rounded-3xl";

        this.letterPool.forEach((item) => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = `${sizeClass} flex items-center justify-center shadow-lg transition-all duration-200 select-none ${
            item.used 
              ? 'opacity-20 pointer-events-none bg-slate-200 border-2 border-slate-300 text-slate-400 scale-90' 
              : 'bg-gradient-to-b from-sky-400 to-blue-500 text-white border-b-4 border-blue-700 active:border-b-0 active:translate-y-1 hover:scale-105 active:scale-95 cursor-grab'
          }`;
          card.textContent = item.char;
          card.dataset.poolId = item.id;
          card.draggable = !item.used && !this.isSolved;

          card.addEventListener('click', () => {
            if (item.used || this.isSolved) return;
            const emptySlotIndex = this.slots.findIndex(s => s === null);
            if (emptySlotIndex !== -1) {
              this.placeLetterInSlot(item.id, emptySlotIndex);
            } else {
              sfx.playTryAgain();
            }
          });

          card.addEventListener('dragstart', (e) => {
            if (item.used || this.isSolved) {
              e.preventDefault();
              return;
            }
            e.dataTransfer.setData('text/plain', item.id.toString());
            card.classList.add('opacity-50');
          });

          card.addEventListener('dragend', () => {
            card.classList.remove('opacity-50');
          });

          this.dom.lettersPoolContainer.appendChild(card);
        });
      }

      placeLetterInSlot(poolId, slotIndex) {
        const poolItem = this.letterPool.find(l => l.id === poolId);
        if (!poolItem || poolItem.used) return;

        if (this.slots[slotIndex]) {
          const oldPoolId = this.slots[slotIndex].poolId;
          const oldPoolItem = this.letterPool.find(l => l.id === oldPoolId);
          if (oldPoolItem) oldPoolItem.used = false;
        }

        poolItem.used = true;
        this.slots[slotIndex] = { char: poolItem.char, poolId: poolItem.id };
        sfx.playPop();

        this.renderBoard();
        this.checkIfComplete();
      }

      removeLetterFromSlot(slotIndex) {
        const slotItem = this.slots[slotIndex];
        if (!slotItem) return;

        const poolItem = this.letterPool.find(l => l.id === slotItem.poolId);
        if (poolItem) poolItem.used = false;

        this.slots[slotIndex] = null;
        sfx.playRemove();
        this.renderBoard();
      }

      resetCurrentBoard() {
        sfx.playRemove();
        this.letterPool.forEach(l => l.used = false);
        this.slots = new Array(this.getCurrentWord().word.length).fill(null);
        this.renderBoard();
      }

      giveHint() {
        if (this.isSolved) return;
        const currentWord = this.getDisplayWord(this.getCurrentWord());
        
        for (let i = 0; i < currentWord.length; i++) {
          const targetChar = currentWord[i];
          const currentSlot = this.slots[i];

          if (!currentSlot || currentSlot.char !== targetChar) {
            if (currentSlot) {
              this.removeLetterFromSlot(i);
            }

            let availablePoolItem = this.letterPool.find(l => l.char === targetChar && !l.used);
            if (!availablePoolItem) {
              const otherSlotIdx = this.slots.findIndex(s => s && s.char === targetChar);
              if (otherSlotIdx !== -1) {
                const borrowedPoolId = this.slots[otherSlotIdx].poolId;
                this.slots[otherSlotIdx] = null;
                availablePoolItem = this.letterPool.find(l => l.id === borrowedPoolId);
                availablePoolItem.used = false;
              }
            }

            if (availablePoolItem) {
              this.placeLetterInSlot(availablePoolItem.id, i);
              const slotElements = this.dom.slotsContainer.children;
              if (slotElements[i]) {
                slotElements[i].classList.add('ring-4', 'ring-emerald-400');
                setTimeout(() => slotElements[i]?.classList.remove('ring-4', 'ring-emerald-400'), 800);
              }
            }
            break;
          }
        }
      }

      checkIfComplete() {
        const isAllFilled = this.slots.every(s => s !== null);
        if (!isAllFilled) return;

        const currentWord = this.getDisplayWord(this.getCurrentWord());
        const assembledWord = this.slots.map(s => s.char).join('');

        if (assembledWord === currentWord) {
          this.handleSuccess();
        } else {
          this.handleFailure();
        }
      }

      handleSuccess() {
        this.isSolved = true;
        sfx.playSuccess();
        launchConfetti();

        const profile = this.profiles[this.currentUser];
        const word = this.getCurrentWord();
        const isFirstTime = !profile.completed[word.id];

        if (isFirstTime) {
          profile.stars += 1;
          profile.completed[word.id] = {
            date: new Date().toISOString(),
            times: 1
          };
        } else {
          profile.completed[word.id].times = (profile.completed[word.id].times || 1) + 1;
        }
        profile.history.push({
          word: word.word,
          success: true,
          time: new Date().toLocaleTimeString()
        });
        this.saveProfiles();
        this.renderProfile();
        this.renderWeekTabs();
        this.renderDayTabs();

        const isLastWordOfDay = this.currentIndex >= this.words.length - 1;
        const currentWeekConfig = weeksConfig.find(w => w.id === this.currentWeek);
        const daysList = currentWeekConfig ? currentWeekConfig.days : [];
        const currentDayIndex = daysList.indexOf(this.currentDay);

        // 如果是當天最後一題，提示即將自動跳下一天
        if (isLastWordOfDay && currentDayIndex !== -1) {
          let nextName = '';
          if (currentDayIndex < daysList.length - 1) {
            const nextDayId = daysList[currentDayIndex + 1];
            const nextDayWords = this.allWords.filter(w => w.week === this.currentWeek && w.day === nextDayId);
            nextName = nextDayWords[0]?.dayLabel || '下一天';
          } else {
            nextName = '整週總複習 🏆';
          }

          this.dom.feedbackEmoji.textContent = '🎉 🌟 👑';
          this.dom.feedbackTitle.textContent = `太棒了，Bella！${word.dayLabel || '今天'}全部過關！`;
          this.dom.feedbackSubtitle.textContent = `All done! Ready for ${nextName}!`;
          this.dom.feedbackActionBtn.textContent = `前進 ${nextName} ➡️`;
        } else {
          const praiseTemplate = PRAISES[Math.floor(Math.random() * PRAISES.length)];
          this.dom.feedbackEmoji.textContent = '🌟 🎉 🏆';
          this.dom.feedbackTitle.textContent = praiseTemplate.zh;
          this.dom.feedbackSubtitle.textContent = praiseTemplate.en;
          this.dom.feedbackActionBtn.textContent = '挑戰下一題 ➡️';
        }

        if (this.dom.feedbackWordBox) {
          this.dom.feedbackWordBox.classList.remove('hidden');

          if (word.image && !word.image.startsWith('<svg') && !word.image.startsWith('data:')) {
            const fallback = word.fallbackImage || '';
            this.dom.feedbackWordImg.innerHTML = `<img src="${word.image}" alt="${word.translation}" onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.dataset.fb=''}else{this.onerror=null;}" data-fb="${fallback}" class="w-full h-full object-cover rounded-xl" />`;
          } else if (word.image && word.image.startsWith('data:image/svg+xml;utf8,')) {
            this.dom.feedbackWordImg.innerHTML = decodeURIComponent(word.image.replace('data:image/svg+xml;utf8,', ''));
          } else if (word.image && word.image.startsWith('<svg')) {
            this.dom.feedbackWordImg.innerHTML = word.image;
          } else if (word.image) {
            this.dom.feedbackWordImg.innerHTML = `<img src="${word.image}" alt="${word.translation}" class="w-full h-full object-cover rounded-xl" />`;
          }

          const displayWord = this.getDisplayWord(word);
          this.dom.feedbackSpellingTiles.innerHTML = displayWord.split('').map(char => `
            <span class="inline-flex items-center justify-center w-6 h-7 sm:w-7 sm:h-8 rounded-lg bg-indigo-500 text-white font-black text-sm sm:text-base shadow-xs">${char}</span>
          `).join('');

          this.dom.feedbackWordText.textContent = displayWord;
          this.dom.feedbackWordTranslation.textContent = word.translation;
          this.dom.feedbackWordPhonics.textContent = word.phonics || '';
          this.dom.feedbackCompleteSentence.textContent = word.sentenceComplete || word.sentence || '';
        }

        this.dom.feedbackCard.classList.remove('hidden');
        this.speak(word.word, 0.85);
      }

      handleFailure() {
        sfx.playTryAgain();
        this.dom.slotsContainer.classList.add('animate-shake');
        setTimeout(() => {
          this.dom.slotsContainer.classList.remove('animate-shake');
        }, 500);
      }

      prevWord() {
        sfx.playPop();
        if (this.currentIndex > 0) {
          this.loadWord(this.currentIndex - 1);
        } else {
          this.loadWord(0);
        }
      }

      showStats() {
        sfx.playPop();
        const profile = this.profiles[this.currentUser] || { stars: 0, completed: {}, history: [] };
        const completedCount = Object.keys(profile.completed).length;
        const totalCount = this.allWords.length;
        const pct = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

        let weekStatsHtml = '';
        weeksConfig.forEach(week => {
          const wWords = this.allWords.filter(w => w.week === week.id);
          const cCount = wWords.filter(w => !!profile.completed[w.id]).length;
          const cTotal = wWords.length;
          const cPct = cTotal > 0 ? Math.round((cCount / cTotal) * 100) : 0;
          weekStatsHtml += `
            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
              <div class="flex justify-between text-xs font-bold text-slate-700 mb-1">
                <span>${week.icon} ${week.name}</span>
                <span>${cCount} / ${cTotal} (${cPct}%)</span>
              </div>
              <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                <div class="bg-pink-500 h-full rounded-full transition-all duration-500" style="width: ${cPct}%"></div>
              </div>
            </div>
          `;
        });

        this.dom.statsList.innerHTML = `
          <div class="bg-gradient-to-r from-pink-500 to-rose-500 text-white p-4 rounded-2xl shadow-md text-center mb-3">
            <div class="text-3xl mb-1">⭐ ${profile.stars}</div>
            <div class="font-extrabold text-base">Bella 的《大家說英語》全真戰報</div>
            <div class="text-xs opacity-90 mt-1">已掌握 ${completedCount} / ${totalCount} 個官方核心單字 (${pct}%)</div>
          </div>

          <div class="bg-amber-50 border border-amber-200 p-3 rounded-2xl text-xs text-amber-900 leading-relaxed mb-3">
            <div class="font-black text-sm mb-1 text-amber-950 flex items-center gap-1">
              <span>💡</span> 每日單元過關提醒
            </div>
            <p class="text-slate-700 leading-relaxed">
              當天單字全部完成後，系統會自動跳到第二天，絕不重複！可以依照每天進度穩扎穩打！
            </p>
          </div>

          <div class="space-y-2">
            <div class="text-xs font-black text-slate-500 uppercase px-1">各週次進度</div>
            ${weekStatsHtml}
          </div>
        `;

        this.dom.statsModal.classList.remove('hidden');
      }

      hideStats() {
        sfx.playPop();
        this.dom.statsModal.classList.add('hidden');
      }
    }

    // 頁面加載完成後啟動
    window.addEventListener('DOMContentLoaded', () => {
      new SpellingApp();
    });
  </script>
</body>
