<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#155e75">
  <title>每週英文書單｜本機 MP3</title>
  <style>
    *{box-sizing:border-box}
    :root{color:#17304c;background:#f0f7f8;font:16px system-ui,sans-serif}
    body{margin:0}
    button,select,input{font:inherit}
    button,select,input[type=search]{border:1px solid #b6cdd6;border-radius:.65rem;padding:.5rem .7rem;color:inherit;background:white}
    button{cursor:pointer} button:disabled{cursor:default;opacity:.55}
    button.primary,button[aria-pressed=true]{background:#156b79;border-color:#156b79;color:white}
    a{color:#11596b}
    header{background:linear-gradient(120deg,#0f536d,#167c7e);color:white;padding:1.2rem max(1rem,calc((100% - 1440px)/2))}
    header a{color:#e0f6fd}
    h1{margin:.25rem 0;font-size:clamp(1.55rem,4vw,2.35rem)}
    h2,h3,p{margin:.35rem 0 .65rem}
    .hero{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
    .hero p{color:#e0f6fd}
    .vehicles{display:flex;gap:.45rem;flex-wrap:wrap}
    .vehicles span{background:#ffffff25;border:1px solid #ffffff50;border-radius:.8rem;padding:.5rem .65rem;white-space:nowrap;font-size:.9rem}
    .fan{display:inline-block;width:1em;height:1em;vertical-align:-.1em}
    .toolbar,.tabs,.row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
    .toolbar{margin:.8rem 0}
    .toolbar input[type=search]{width:min(100%,22rem)}
    .tabs button{font-size:.88rem}
    .layout{max-width:1472px;margin:auto;padding:1rem;display:grid;grid-template-columns:minmax(270px,350px) minmax(0,1fr);gap:1rem;align-items:start}
    .panel,.week{background:white;border:1px solid #c9e0e4;border-radius:1rem;padding:1rem}
    .panel{position:sticky;top:1rem}
    .panel h2{font-size:1.2rem}
    .muted,.meta{color:#456079;font-size:.86rem}
    .status{font-size:.9rem;overflow-wrap:anywhere}
    .file{display:block;margin:.7rem 0 .4rem}
    input[type=file],audio{max-width:100%;width:100%}
    audio{margin:.5rem 0}
    #tracks{padding-left:1.45rem;max-height:19rem;overflow:auto;scrollbar-gutter:stable}
    #tracks li{margin:.25rem 0}
    #tracks button{width:100%;text-align:left;overflow-wrap:anywhere;font-size:.9rem}
    #tracks button[aria-current=true]{background:#d1f1eb;border-color:#39978c}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,245px),1fr));gap:.8rem}
    .week{border-top:4px solid #f0ad55}
    .week.current{border-color:#218c83}
    .week h3{font-size:1.03rem}
    .book{padding:.65rem 0;border-top:1px dashed #c8dbe2;overflow-wrap:anywhere}
    .book.playing{color:#075e59}
    .book .row{margin-top:.38rem}
    .book button,.ticks button{font-size:.83rem}
    .ticks{margin:.4rem 0}
    footer{max-width:1472px;margin:auto;padding:1rem;color:#456079;font-size:.85rem}
    @media(max-width:760px){.layout{grid-template-columns:1fr}.panel{position:static}#tracks{max-height:13rem}}
  </style>
</head>
<body>
  <header>
    <div class="hero">
      <div><a href="https://tim-english-train.ifen-chiang.chatgpt.site/">← 回到 Tim 的單字首頁</a><h1>每週英文書單</h1><p>選一週，搭上英文故事列車。</p></div>
      <div class="vehicles" aria-label="交通與家電圖案">
        <span>🚌 巴士</span><span>🚄 高鐵</span>
        <span><svg class="fan" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 10c-6-3-2-9 2-7 3 2 2 5 0 8 5-3 10 2 6 6-3 2-6 0-7-3 0 6-7 8-9 3-1-3 2-5 6-5Z"/><circle cx="12" cy="12" r="2" fill="#155e75"/></svg> 電風扇</span>
        <span>❄️ 空調</span>
      </div>
    </div>
    <div class="toolbar">
      <input type="search" id="q" aria-label="跨所有階搜尋書名" placeholder="搜尋書名…（跨所有階）">
      <label><input type="checkbox" id="onlyAudio"> 只顯示有本機 MP3</label>
      <label for="weekSelect">跳到週次</label><select id="weekSelect"></select>
      <button id="playSelected" class="primary">▶ 本週循環</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="書單階級"></nav>
  </header>
  <div class="layout">
    <aside class="panel" id="playlist" aria-label="本機 MP3 播放器">
      <h2>🎧 本機 MP3 歌單</h2>
      <label for="local" class="file">選擇解壓後的 English_CD 資料夾</label>
      <input id="local" type="file" webkitdirectory multiple>
      <p id="source" class="status" role="status">正在讀取已儲存的本機歌單…</p>
      <h3 id="playlistTitle">選擇一週</h3>
      <p id="now" class="status" aria-live="polite"></p>
      <audio id="localAudio" controls preload="none"></audio>
      <div class="row">
        <button id="prev" aria-label="上一軌">⏮ 上一軌</button><button id="next" aria-label="下一軌">下一軌 ⏭</button>
        <label for="rate">速度</label><select id="rate"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select>
        <label for="sleep">定時暫停</label><select id="sleep"><option value="0">不定時</option><option value="15">15 分</option><option value="30">30 分</option><option value="45">45 分</option><option value="60">60 分</option><option value="-1">本軌播完</option></select>
      </div>
      <p id="status" class="status" role="status"></p>
      <ol id="tracks"></ol>
      <p class="muted">歌單與聆聽紀錄保存在這個瀏覽器。每本書最後一軌自然播完會加一次，也可手動登記。</p>
    </aside>
    <main id="main"></main>
  </div>
  <footer>廖彩杏每週英文書單 · 七階 / 84 週 · <a href="english_cd.html">開啟完整 CD 播放器</a></footer>
  <script src="liao_data.js"></script>
  <script src="english_cd.js?v=weekly-panel"></script>
  <script src="liao_local_player.js"></script>
</body>
</html>
