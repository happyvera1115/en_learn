<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>小朋友單字拼拼樂 | Kids Word Spelling</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-shake {
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .animate-float {
      animation: float 3s ease-in-out infinite;
    }
    .cursor-grab {
      cursor: grab;
    }
    .cursor-grab:active {
      cursor: grabbing;
    }
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-amber-100 via-sky-100 to-indigo-100 min-h-screen lg:h-screen lg:max-h-screen text-slate-800 flex flex-col justify-between overflow-x-hidden">

  <!-- 灑花畫布 (純原生 Canvas，不依賴任何外部套件) -->
  <canvas id="confetti-canvas"></canvas>

  <!-- 頂部導覽列：角色切換與計星榜 -->
  <header class="w-full max-w-5xl mx-auto px-4 py-2 sm:py-2.5 flex items-center justify-between gap-2 flex-shrink-0">
    <!-- 學生切換 -->
    <div class="flex items-center gap-2 sm:gap-3 bg-white/85 backdrop-blur-md px-3 py-1.5 rounded-full shadow-md border border-white/80">
      <span class="text-xs sm:text-sm font-black text-slate-500 hidden sm:inline">小朋友：</span>
      
      <!-- Tim 按鈕 -->
      <button id="user-tim" class="flex items-center gap-1.5 px-3 py-1 rounded-full font-black text-sm sm:text-base text-blue-700 transition-all duration-200">
        <span class="text-xl">👦</span>
        <span>Tim</span>
      </button>

      <!-- Bella 按鈕 -->
      <button id="user-bella" class="flex items-center gap-1.5 px-3 py-1 rounded-full font-black text-sm sm:text-base text-pink-700 transition-all duration-200 opacity-70">
        <span class="text-xl">👧</span>
        <span>Bella</span>
      </button>
    </div>

    <!-- 星星獎勵與戰績按鈕 -->
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-1.5 bg-amber-400 text-amber-950 px-3.5 py-1.5 rounded-full font-black text-base sm:text-lg shadow-md">
        <span>⭐</span>
        <span id="user-stars">0</span>
      </div>

      <button id="open-stats-btn" title="查看成績與紀錄" class="flex items-center justify-center w-10 h-10 bg-white/90 hover:bg-white text-slate-700 rounded-full shadow-md border border-white transition-all hover:scale-105 active:scale-95 text-lg">
        🏆
      </button>
    </div>
  </header>

  <!-- 單元選單分類列 (7 大單元篇幅) -->
  <nav class="w-full max-w-5xl mx-auto px-2 py-1 flex items-center justify-center gap-1.5 sm:gap-2 flex-wrap flex-shrink-0" id="category-tabs">
    <button type="button" class="flex items-center gap-1.5 px-3 py-1 sm:py-1.5 rounded-full font-bold text-xs sm:text-sm bg-white/85 text-slate-600 shadow-sm border border-slate-200"><span>🎒</span><span>一年級</span></button>
    <button type="button" class="flex items-center gap-1.5 px-3 py-1 sm:py-1.5 rounded-full font-bold text-xs sm:text-sm bg-white/85 text-slate-600 shadow-sm border border-slate-200"><span>✏️</span><span>二年級</span></button>
    <button type="button" class="flex items-center gap-1.5 px-3 py-1 sm:py-1.5 rounded-full font-bold text-xs sm:text-sm bg-indigo-600 text-white shadow-md scale-105 ring-2 ring-indigo-300"><span>🔤</span><span>三年級 Ready</span></button>
    <button type="button" class="flex items-center gap-1.5 px-3 py-1 sm:py-1.5 rounded-full font-bold text-xs sm:text-sm bg-white/85 text-slate-600 shadow-sm border border-slate-200"><span>👋</span><span>三年級 Unit 1</span></button>
    <button type="button" class="flex items-center gap-1.5 px-3 py-1 sm:py-1.5 rounded-full font-bold text-xs sm:text-sm bg-white/85 text-slate-600 shadow-sm border border-slate-200"><span>🔢</span><span>三年級 Unit 2</span></button>
    <button type="button" class="flex items-center gap-1.5 px-3 py-1 sm:py-1.5 rounded-full font-bold text-xs sm:text-sm bg-white/85 text-slate-600 shadow-sm border border-slate-200"><span>📚</span><span>三年級 Unit 3</span></button>
    <button type="button" class="flex items-center gap-1.5 px-3 py-1 sm:py-1.5 rounded-full font-bold text-xs sm:text-sm bg-white/85 text-slate-600 shadow-sm border border-slate-200"><span>🎨</span><span>三年級 Unit 4</span></button>
    <button type="button" class="flex items-center gap-1.5 px-3 py-1 sm:py-1.5 rounded-full font-bold text-xs sm:text-sm bg-white/85 text-slate-600 shadow-sm border border-slate-200"><span>🚌</span><span>公車與捷運</span></button>
  </nav>

  <!-- 主遊戲畫面 (支援 16:9 螢幕一覽無遺，平板橫向完美滿版免滑動) -->
  <main class="w-full max-w-5xl mx-auto px-3 sm:px-4 py-1 sm:py-2 flex-1 flex flex-col justify-center min-h-0">
    
    <!-- 題目主卡片 (橫向 16:9 雙欄自適應設計) -->
    <div class="w-full bg-white/90 backdrop-blur-lg rounded-3xl p-4 sm:p-5 lg:p-6 shadow-xl border-4 border-white/90 relative flex flex-col md:flex-row items-center md:items-stretch gap-4 md:gap-6">
      
      <!-- 已過關徽章 -->
      <div id="word-completed-badge" class="hidden absolute top-3 right-3 sm:top-4 sm:right-4 bg-emerald-500 text-white text-xs sm:text-sm font-black px-3 py-1 rounded-full shadow-md flex items-center gap-1 z-10">
        <span>🎉</span> 已經學會囉！
      </div>

      <!-- 左側：圖片與單字發音區 -->
      <div class="w-full md:w-5/12 flex flex-col items-center justify-center text-center p-3 rounded-2xl bg-amber-50/70 border border-amber-200/80">
        <!-- 圖片容器 (直接內嵌 SVG，永遠不破圖) -->
        <div class="relative w-28 h-28 sm:w-36 sm:h-36 md:w-44 md:h-44 bg-gradient-to-tr from-amber-50 to-orange-50 rounded-2xl p-2 shadow-inner border-2 border-amber-200 flex items-center justify-center overflow-hidden animate-float mb-2 sm:mb-3">
          <div id="word-image" class="w-full h-full flex items-center justify-center filter drop-shadow">
            <img src="images/cap.jpg" alt="鴨舌帽" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=400&q=80'" class="w-full h-full object-cover rounded-2xl shadow-sm" />
          </div>
        </div>

        <!-- 單字資訊與發音按鈕 -->
        <div class="flex flex-col items-center">
          <div class="flex items-baseline gap-2 mb-0.5">
            <h2 id="word-translation" class="text-2xl sm:text-3xl font-black text-slate-800 tracking-wide">鴨舌帽</h2>
            <span id="word-phonics" class="text-xs sm:text-sm font-medium text-slate-400">/kæp/</span>
          </div>
          <p id="word-hint" class="text-slate-500 text-xs sm:text-sm mb-2.5 font-medium line-clamp-1">戴在頭上遮陽的帽子</p>

          <!-- 語音朗讀按鈕群 -->
          <div class="flex items-center gap-2.5">
            <button id="speak-btn" class="flex items-center gap-1.5 bg-indigo-500 hover:bg-indigo-600 active:scale-95 text-white font-extrabold px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl sm:rounded-2xl shadow-md transition-all text-xs sm:text-sm">
              <span class="text-base sm:text-lg">🔊</span>
              <span>聽發音</span>
            </button>
            <button id="speak-slow-btn" class="flex items-center gap-1.5 bg-amber-400 hover:bg-amber-500 active:scale-95 text-amber-950 font-extrabold px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl sm:rounded-2xl shadow-md transition-all text-xs sm:text-sm" title="慢速朗讀">
              <span class="text-base sm:text-lg">🐢</span>
              <span>慢速</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 右側：拼字空格 + 字母池 -->
      <div class="w-full md:w-7/12 flex flex-col justify-between">
        
        <!-- 操作小提醒 -->
        <div class="text-xs text-slate-600 bg-sky-50 px-3 py-1 rounded-full mb-2 border border-sky-100 flex items-center justify-center gap-1 font-medium">
          <span>💡</span> 拖拉字母到空格，或「點擊字母」自動排入喔！
        </div>

        <!-- 拼字空格放置區 (Slots) -->
        <div id="slots-container" class="flex flex-wrap items-center justify-center gap-2 sm:gap-2.5 my-auto py-2 min-h-[4.5rem]">
          <div class="w-12 h-14 sm:w-14 sm:h-16 md:w-15 md:h-17 rounded-2xl flex items-center justify-center font-bold text-2xl sm:text-3xl shadow-inner transition-all duration-200 cursor-pointer select-none bg-white/80 border-3 border-dashed border-sky-300 text-transparent hover:border-sky-400"><span class="text-sky-200 text-lg font-normal">1</span></div>
          <div class="w-12 h-14 sm:w-14 sm:h-16 md:w-15 md:h-17 rounded-2xl flex items-center justify-center font-bold text-2xl sm:text-3xl shadow-inner transition-all duration-200 cursor-pointer select-none bg-white/80 border-3 border-dashed border-sky-300 text-transparent hover:border-sky-400"><span class="text-sky-200 text-lg font-normal">2</span></div>
          <div class="w-12 h-14 sm:w-14 sm:h-16 md:w-15 md:h-17 rounded-2xl flex items-center justify-center font-bold text-2xl sm:text-3xl shadow-inner transition-all duration-200 cursor-pointer select-none bg-white/80 border-3 border-dashed border-sky-300 text-transparent hover:border-sky-400"><span class="text-sky-200 text-lg font-normal">3</span></div>
        </div>

        <!-- 亂序字母池 (Letters Pool) -->
        <div class="w-full bg-slate-100/80 rounded-2xl p-3 sm:p-3.5 border-2 border-slate-200 mt-2">
          <div class="flex items-center justify-between mb-2 px-1">
            <span class="text-xs font-black text-slate-400 uppercase tracking-wider">亂序字母庫 (點擊或拖曳)</span>
            <div class="flex items-center gap-2">
              <button id="hint-btn" class="text-xs font-bold text-amber-600 hover:text-amber-700 bg-amber-100 hover:bg-amber-200 px-2.5 py-1 rounded-lg transition-colors flex items-center gap-1">
                <span>💡</span> 提示我
              </button>
              <button id="reset-letters-btn" class="text-xs font-bold text-slate-500 hover:text-slate-700 bg-white px-2.5 py-1 rounded-lg shadow-sm border border-slate-200 transition-colors flex items-center gap-1">
                <span>🔄</span> 重排
              </button>
            </div>
          </div>

          <div id="letters-pool" class="flex flex-wrap items-center justify-center gap-2 sm:gap-2.5 min-h-[4rem]">
            <button type="button" class="w-12 h-14 sm:w-14 sm:h-16 md:w-15 md:h-17 rounded-2xl flex items-center justify-center font-extrabold text-2xl sm:text-3xl shadow-lg transition-all duration-200 select-none bg-gradient-to-b from-sky-400 to-blue-500 text-white border-b-4 border-blue-700 active:border-b-0 active:translate-y-1 hover:scale-105 active:scale-95 cursor-grab">p</button>
            <button type="button" class="w-12 h-14 sm:w-14 sm:h-16 md:w-15 md:h-17 rounded-2xl flex items-center justify-center font-extrabold text-2xl sm:text-3xl shadow-lg transition-all duration-200 select-none bg-gradient-to-b from-sky-400 to-blue-500 text-white border-b-4 border-blue-700 active:border-b-0 active:translate-y-1 hover:scale-105 active:scale-95 cursor-grab">a</button>
            <button type="button" class="w-12 h-14 sm:w-14 sm:h-16 md:w-15 md:h-17 rounded-2xl flex items-center justify-center font-extrabold text-2xl sm:text-3xl shadow-lg transition-all duration-200 select-none bg-gradient-to-b from-sky-400 to-blue-500 text-white border-b-4 border-blue-700 active:border-b-0 active:translate-y-1 hover:scale-105 active:scale-95 cursor-grab">c</button>
          </div>
        </div>

      </div>

    </div>

    <!-- 底部切換單字列 -->
    <div class="flex items-center justify-between w-full max-w-lg mx-auto mt-2 sm:mt-3 px-2 gap-2 flex-shrink-0">
      <button id="prev-word-btn" class="flex items-center gap-1 bg-white hover:bg-slate-50 text-slate-700 font-bold px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl sm:rounded-2xl shadow border border-white transition-all active:scale-95 text-xs sm:text-sm">
        <span>⬅️</span> 上一題
      </button>

      <!-- 隨機洗牌出題按鈕 -->
      <button id="shuffle-words-btn" type="button" class="flex items-center gap-1 bg-gradient-to-r from-amber-400 to-orange-400 hover:from-amber-500 hover:to-orange-500 text-white font-black px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl sm:rounded-2xl shadow-md transition-all active:scale-95 text-xs sm:text-sm">
        <span>🔀</span><span>隨機出題</span>
      </button>

      <div id="word-counter" class="text-slate-500 font-black text-xs sm:text-sm bg-white/60 px-3 py-1 rounded-full shadow-inner">
        1 / 15
      </div>

      <button id="next-word-btn" class="flex items-center gap-1 bg-white hover:bg-slate-50 text-slate-700 font-bold px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl sm:rounded-2xl shadow border border-white transition-all active:scale-95 text-xs sm:text-sm">
        下一題 <span>➡️</span>
      </button>
    </div>

  </main>

  <!-- 回饋浮層卡片 (成功讚美 / 失敗溫和打氣) -->
  <div id="feedback-card" class="hidden fixed inset-0 z-40 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 sm:p-7 max-w-lg w-full shadow-2xl border-4 border-amber-300 text-center transform">
      <div id="feedback-emoji" class="text-4xl sm:text-5xl mb-2">🎉 🌟 👏</div>
      <h3 id="feedback-title" class="text-2xl sm:text-3xl font-black text-slate-800 mb-1">太棒了，Tim！答對了！</h3>
      <p id="feedback-subtitle" class="text-indigo-600 font-bold text-sm sm:text-base mb-3">Awesome job! You are a superstar!</p>
      
      <!-- 答對時的單字強化複習區 (包含圖片、正確拼字、中文與三大發音按鈕) -->
      <div id="feedback-word-box" class="hidden my-4 p-3.5 sm:p-4 bg-amber-50/95 rounded-2xl border-2 border-amber-200 text-left">
        <div class="flex items-center gap-3.5 mb-3">
          <!-- 單字圖片 -->
          <div id="feedback-word-img" class="w-18 h-18 sm:w-20 sm:h-20 bg-white rounded-2xl p-1.5 shadow-sm border border-amber-200 flex items-center justify-center flex-shrink-0">
            <!-- 注入 SVG -->
          </div>
          <div class="flex-1 min-w-0">
            <!-- 正確拼字方塊 [c] [a] [p] -->
            <div id="feedback-spelling-tiles" class="flex flex-wrap gap-1.5 mb-1.5">
              <!-- 動態生成字母方塊 -->
            </div>
            <div class="flex items-baseline gap-2">
              <span id="feedback-word-text" class="text-2xl sm:text-3xl font-black text-indigo-700 tracking-wider">cap</span>
              <span id="feedback-word-translation" class="text-lg sm:text-xl font-bold text-slate-700">鴨舌帽</span>
            </div>
            <div id="feedback-word-phonics" class="text-xs text-slate-400 font-medium">/kæp/</div>
          </div>
        </div>

        <!-- 3 個發音按鈕：拼字發音、英文發音、中文發音 -->
        <div class="grid grid-cols-3 gap-2 pt-2.5 border-t border-amber-200">
          <button id="feedback-btn-spell" type="button" class="flex items-center justify-center gap-1 bg-white hover:bg-amber-100 text-indigo-700 font-extrabold text-xs py-2 px-1 rounded-xl shadow-sm border border-indigo-200 active:scale-95 transition-all">
            <span>🔤</span><span>拼字發音</span>
          </button>
          <button id="feedback-btn-en" type="button" class="flex items-center justify-center gap-1 bg-white hover:bg-amber-100 text-blue-700 font-extrabold text-xs py-2 px-1 rounded-xl shadow-sm border border-blue-200 active:scale-95 transition-all">
            <span>🔊</span><span>英文發音</span>
          </button>
          <button id="feedback-btn-zh" type="button" class="flex items-center justify-center gap-1 bg-white hover:bg-amber-100 text-emerald-700 font-extrabold text-xs py-2 px-1 rounded-xl shadow-sm border border-emerald-200 active:scale-95 transition-all">
            <span>🗣️</span><span>中文發音</span>
          </button>
        </div>
      </div>

      <button id="feedback-action-btn" class="w-full py-3.5 bg-gradient-to-r from-amber-400 to-orange-400 hover:from-amber-500 hover:to-orange-500 text-white font-black text-xl rounded-2xl shadow-lg transition-transform active:scale-95">
        挑戰下一個單字 ➡️
      </button>
    </div>
  </div>

  <!-- 成績與學習紀錄彈窗 (Tim & Bella) -->
  <div id="stats-modal" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-lg w-full shadow-2xl border-2 border-slate-100 max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
        <h3 class="text-xl font-black text-slate-800 flex items-center gap-2">
          <span>🏆</span> 學習戰報與成就
        </h3>
        <button id="close-stats-btn" class="text-slate-400 hover:text-slate-600 text-2xl font-bold w-8 h-8 rounded-full flex items-center justify-center bg-slate-100">
          ✕
        </button>
      </div>

      <div id="stats-list" class="flex-1 overflow-y-auto pr-1">
        <!-- 動態填入 -->
      </div>
    </div>
  </div>

  <!-- 底部提示 -->
  <footer class="w-full text-center py-1 text-xs text-slate-400 font-medium flex-shrink-0">
    為 <span id="current-user-name" class="font-bold text-slate-600">Tim</span> 的專屬英語拼字探險 🎈
  </footer>

    // ==========================================
    // 2. 原生音效合成器 (Web Audio API)
    // ==========================================
    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playPop() {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch (e) {}
      }
      playRemove() {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(260, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch (e) {}
      }
      playSuccess() {
        try {
          this.init();
          const notes = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            const startTime = this.ctx.currentTime + idx * 0.1;
            gain.gain.setValueAtTime(0.3, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.35);
          });
        } catch (e) {}
      }
      playTryAgain() {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, this.ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(240, this.ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.25);
        } catch (e) {}
      }
    }
    const sfx = new SoundFX();

    // ==========================================
    // 3. 原生全螢幕彩色灑花特效 (零外掛依賴)
    // ==========================================
    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];

      for (let i = 0; i < 120; i++) {
        particles.push({
          x: canvas.width * (0.2 + Math.random() * 0.6),
          y: canvas.height * 0.5,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.8) * 18,
          size: 6 + Math.random() * 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 12,
          gravity: 0.45,
          opacity: 1
        });
      }

      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.rotation += p.rotationSpeed;
          p.opacity -= 0.009;

          if (p.opacity > 0 && p.y < canvas.height) {
            alive = true;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.opacity);
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            ctx.restore();
          }
        });

        frame++;
        if (alive && frame < 180) {
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      animate();
    }

    // ==========================================
    // 4. 主遊戲控制邏輯
    // ==========================================
    class SpellingApp {
      constructor() {
        this.allWords = [...initialWords];
        this.currentCategory = 'grade3_ready';
        this.isRandomOrder = true; // 預設啟用亂數隨機出題
        this.currentUser = 'Tim';
        this.profiles = this.loadProfiles();
        this.words = this.getWordsByCategory(this.currentCategory);
        this.currentIndex = 0;
        
        this.slots = [];
        this.letterPool = [];
        this.isSolved = false;
        this.speechSequenceToken = 0;

        this.cacheDom();
        this.renderCategoryTabs();
        this.bindEvents();
        this.renderProfile();
        this.loadWord(0);
      }

      // 依據是否為專有名詞決定大小寫（預設一般名詞一律使用小寫字母）
      getDisplayWord(wordData) {
        if (!wordData) return '';
        if (wordData.isProperNoun) return wordData.word;
        return wordData.word.toLowerCase();
      }

      // 開始或點擊聽發音時：唸一次英文、中文，再一次英文、中文，總共兩次
      playBilingualTwice(word, translation, onEnd = null) {
        if (!('speechSynthesis' in window)) {
          if (onEnd) onEnd();
          return;
        }
        window.speechSynthesis.cancel();
        const currentToken = ++this.speechSequenceToken;

        // 第 1 次：英文
        this.speak(word, 0.88, () => {
          if (this.speechSequenceToken !== currentToken) return;
          setTimeout(() => {
            if (this.speechSequenceToken !== currentToken) return;
            // 第 1 次：中文
            this.speakZh(translation, () => {
              if (this.speechSequenceToken !== currentToken) return;
              setTimeout(() => {
                if (this.speechSequenceToken !== currentToken) return;
                // 第 2 次：英文
                this.speak(word, 0.88, () => {
                  if (this.speechSequenceToken !== currentToken) return;
                  setTimeout(() => {
                    if (this.speechSequenceToken !== currentToken) return;
                    // 第 2 次：中文
                    this.speakZh(translation, onEnd);
                  }, 250);
                });
              }, 350);
            });
          }, 250);
        });
      }

      // Fisher-Yates 隨機洗牌演算法
      shuffleArray(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      getWordsByCategory(catId) {
        let pool = (this.allWords || []).filter(w => w.category === catId);
        if (pool.length === 0) pool = [...(this.allWords || [])];

        const profiles = this.profiles || this.loadProfiles();
        const user = this.currentUser || 'Tim';
        const profile = (profiles && profiles[user]) ? profiles[user] : { completed: {} };
        const completedMap = profile.completed || {};
        const practiced = pool.filter(w => !!completedMap[w.id]);
        const unpracticed = pool.filter(w => !completedMap[w.id]);

        // 每次出題以 15 個單字為原則（以練習過的 10 個為主，搭配 5 個新的還沒練習過的）
        let targetPracticed = Math.min(10, practiced.length);
        let targetNew = Math.min(5, unpracticed.length);

        // 如果練習過的不足 10 個，由未練習過的補足
        if (targetPracticed < 10) {
          const shortage = 10 - targetPracticed;
          targetNew = Math.min(targetNew + shortage, unpracticed.length);
        }

        // 如果未練習過的不足 5 個，由已練習過的補足
        if (targetNew < 5) {
          const shortage = 5 - targetNew;
          targetPracticed = Math.min(targetPracticed + shortage, practiced.length);
        }

        const shuffledPracticed = this.shuffleArray(practiced).slice(0, targetPracticed);
        const shuffledUnpracticed = this.shuffleArray(unpracticed).slice(0, targetNew);

        const combined = [...shuffledPracticed, ...shuffledUnpracticed];
        return this.shuffleArray(combined);
      }

        sfx.playPop();

        this.currentIndex = 0;
        this.loadWord(0);

      renderCategoryTabs() {
        if (!this.dom.categoryTabs) return;
        this.dom.categoryTabs.innerHTML = '';

        const profile = this.profiles[this.currentUser] || { completed: {} };

        categories.forEach(cat => {
          const btn = document.createElement('button');
          btn.type = 'button';
          const isActive = this.currentCategory === cat.id;

          const catWords = this.allWords.filter(w => w.category === cat.id);
          const masteredCount = catWords.filter(w => !!profile.completed[w.id]).length;
          const totalCount = catWords.length;

          btn.className = `flex items-center gap-1.5 px-3 py-1 sm:py-1.5 rounded-full font-bold text-xs sm:text-sm transition-all duration-200 ${
            isActive 
              ? 'bg-indigo-600 text-white shadow-md scale-105 ring-2 ring-indigo-300' 
              : 'bg-white/85 hover:bg-white text-slate-600 shadow-sm border border-slate-200 hover:scale-102'
          }`;

          btn.innerHTML = `<span>${cat.icon}</span><span>${cat.name}</span><span class="text-[11px] sm:text-xs opacity-75 font-medium">(${masteredCount}/${totalCount})</span>`;
          btn.addEventListener('click', () => {
            sfx.playPop();
            this.currentCategory = cat.id;
            this.words = this.getWordsByCategory(this.currentCategory);
            this.renderCategoryTabs();
            this.currentIndex = 0;
            this.loadWord(0);
          });
          this.dom.categoryTabs.appendChild(btn);
        });
      }

      bindEvents() {
        this.dom.userTimBtn.addEventListener('click', () => this.switchUser('Tim'));
        this.dom.userBellaBtn.addEventListener('click', () => this.switchUser('Bella'));

        this.dom.speakBtn.addEventListener('click', () => {
          sfx.playPop();
          const w = this.getCurrentWord();
          this.playBilingualTwice(w.word, w.translation);
        });
        this.dom.speakSlowBtn.addEventListener('click', () => this.speak(this.getCurrentWord().word, 0.55));

        this.dom.resetLettersBtn.addEventListener('click', () => this.resetCurrentBoard());
        this.dom.hintBtn.addEventListener('click', () => this.giveHint());
        this.dom.prevWordBtn.addEventListener('click', () => this.prevWord());
        this.dom.nextWordBtn.addEventListener('click', () => this.nextWord());
        this.dom.shuffleWordsBtn?.addEventListener('click', () => this.shuffleCurrentQuestions());

        this.dom.statsModalBtn.addEventListener('click', () => this.showStats());
        this.dom.closeStatsBtn.addEventListener('click', () => this.hideStats());
        this.dom.statsModal.addEventListener('click', (e) => {
          if (e.target === this.dom.statsModal) this.hideStats();
        });

        // 答對複習按鈕群 (拼字、英文、中文發音)
        this.dom.feedbackBtnSpell?.addEventListener('click', () => {
          sfx.playPop();
          this.speakSpelling(this.getCurrentWord().word);
        });
        this.dom.feedbackBtnEn?.addEventListener('click', () => {
          sfx.playPop();
          this.speak(this.getCurrentWord().word, 0.85);
        });
        this.dom.feedbackBtnZh?.addEventListener('click', () => {
          sfx.playPop();
          this.speakZh(this.getCurrentWord().translation);
        });

        this.dom.feedbackActionBtn.addEventListener('click', () => {
          window.speechSynthesis?.cancel();
          this.speechSequenceToken++;
          this.dom.feedbackCard.classList.add('hidden');
          if (this.isSolved) {
            if (this.currentCategory === 'unlearned') {
              this.words = this.getWordsByCategory('unlearned');
              this.renderCategoryTabs();
              if (this.words.length === 0) {
                this.loadWord(0);
                return;
              }
              if (this.currentIndex >= this.words.length) {
                this.currentIndex = 0;
              }
              this.loadWord(this.currentIndex);
            } else {
              this.nextWord();
            }
          }
        });
      }

      switchUser(user) {
        sfx.playPop();
        this.currentUser = user;
        this.renderProfile();
        this.words = this.getWordsByCategory(this.currentCategory);
        this.renderCategoryTabs();
        this.loadWord(0);
      }

      renderProfile() {
        const profile = this.profiles[this.currentUser];
        this.dom.currentUserNameEl.textContent = profile.name;
        this.dom.userStarsEl.textContent = profile.stars;

        if (this.currentUser === 'Tim') {
          this.dom.userTimBtn.classList.add('ring-4', 'ring-amber-400', 'bg-blue-100', 'scale-105');
          this.dom.userTimBtn.classList.remove('opacity-70');
          this.dom.userBellaBtn.classList.remove('ring-4', 'ring-amber-400', 'bg-pink-100', 'scale-105');
          this.dom.userBellaBtn.classList.add('opacity-70');
        } else {
          this.dom.userBellaBtn.classList.add('ring-4', 'ring-amber-400', 'bg-pink-100', 'scale-105');
          this.dom.userBellaBtn.classList.remove('opacity-70');
          this.dom.userTimBtn.classList.remove('ring-4', 'ring-amber-400', 'bg-blue-100', 'scale-105');
          this.dom.userTimBtn.classList.add('opacity-70');
        }
      }

      getCurrentWord() {
        return this.words[this.currentIndex] || this.words[0];
      }

      renderAllDoneState() {
        this.currentIndex = 0;
        this.isSolved = true;
        this.dom.wordTranslation.textContent = "全部學會了！";
        this.dom.wordPhonics.textContent = "Great Job! 🌟";
        this.dom.wordHint.textContent = `太強了！${this.currentUser} 已經掌握全部單字！可以選其他單元自由複習喔！`;
        this.dom.wordCounter.textContent = `0 / 0`;
        this.dom.wordImg.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="%23fef08a"/><path d="M50 18 L59 36 L79 39 L64 53 L68 73 L50 63 L32 73 L36 53 L21 39 L41 36 Z" fill="%23f59e0b"/><circle cx="50" cy="46" r="6" fill="%23fff"/></svg>`;
        this.dom.slotsContainer.innerHTML = `<div class="text-indigo-700 font-extrabold text-sm sm:text-base bg-indigo-50 border border-indigo-200 px-5 py-3 rounded-2xl">🎉 太棒了！目前沒有尚未學過的單字囉！</div>`;
        this.dom.lettersPoolContainer.innerHTML = `<div class="text-slate-400 font-bold text-xs sm:text-sm py-2">點選上方「🌈 全部單字」或其他分類隨時複習</div>`;
        const completedBadge = document.getElementById('word-completed-badge');
        if (completedBadge) completedBadge.classList.add('hidden');
        launchConfetti();
        this.speakZh(`太厲害了，${this.currentUser}！所有單字都已經學會了！`);
      }

      loadWord(index) {
        if (!this.words || this.words.length === 0) {
          this.renderAllDoneState();
          return;
        }
        if (index < 0) index = this.words.length - 1;
        if (index >= this.words.length) index = 0;
        this.currentIndex = index;
        this.isSolved = false;

        const wordData = this.getCurrentWord();
        const wordClean = this.getDisplayWord(wordData);

        if (wordData.image && !wordData.image.startsWith('<svg') && !wordData.image.startsWith('data:')) {
          const fallback = wordData.fallbackImage || '';
          this.dom.wordImg.innerHTML = `<img src="${wordData.image}" alt="${wordData.translation}" onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.dataset.fb=''}else{this.onerror=null;}" data-fb="${fallback}" class="w-full h-full object-cover rounded-2xl shadow-sm" />`;
        } else if (wordData.image && wordData.image.startsWith('data:image/svg+xml;utf8,')) {
          this.dom.wordImg.innerHTML = decodeURIComponent(wordData.image.replace('data:image/svg+xml;utf8,', ''));
        } else if (wordData.image && wordData.image.startsWith('<svg')) {
          this.dom.wordImg.innerHTML = wordData.image;
        } else if (wordData.image) {
          this.dom.wordImg.innerHTML = `<img src="${wordData.image}" alt="${wordData.translation}" class="w-full h-full object-cover rounded-2xl shadow-sm" />`;
        }
        this.dom.wordTranslation.textContent = wordData.translation;
        this.dom.wordPhonics.textContent = wordData.phonics || '';
        this.dom.wordHint.textContent = wordData.hint || '';
        this.dom.wordCounter.textContent = `${this.currentIndex + 1} / ${this.words.length}`;
        this.dom.feedbackCard.classList.add('hidden');

        const isCompleted = !!this.profiles[this.currentUser].completed[wordData.id];
        const completedBadge = document.getElementById('word-completed-badge');
        if (completedBadge) {
          completedBadge.classList.toggle('hidden', !isCompleted);
        }

        this.slots = new Array(wordClean.length).fill(null);

        const chars = wordClean.split('');
        const lettersWithId = chars.map((ch, idx) => ({ id: idx, char: ch, used: false }));
        
        let shuffled;
        let attempts = 0;
        do {
          shuffled = [...lettersWithId].sort(() => Math.random() - 0.5);
          attempts++;
        } while (shuffled.map(l => l.char).join('') === wordClean && chars.length > 2 && attempts < 10);

        this.letterPool = shuffled;
        this.renderBoard();

        setTimeout(() => {
          this.playBilingualTwice(wordData.word, wordData.translation);
        }, 300);
      }

      renderBoard() {
        this.renderSlots();
        this.renderPool();
      }

      renderSlots() {
        this.dom.slotsContainer.innerHTML = '';
        const isLong = this.slots.length > 5;
        const sizeClass = isLong
          ? "w-10 h-13 sm:w-12 sm:h-15 md:w-13 md:h-16 text-xl sm:text-2xl md:text-3xl rounded-xl sm:rounded-2xl"
          : "w-12 h-14 sm:w-14 sm:h-16 md:w-15 md:h-17 text-2xl sm:text-3xl md:text-4xl rounded-2xl";

        this.slots.forEach((slotItem, slotIndex) => {
          const slotEl = document.createElement('div');
          slotEl.className = `${sizeClass} flex items-center justify-center font-bold shadow-inner transition-all duration-200 cursor-pointer select-none ${
            slotItem 
              ? 'bg-amber-300 text-amber-950 border-3 border-amber-400 shadow-md transform active:scale-95' 
              : 'bg-white/80 border-3 border-dashed border-sky-300 text-transparent hover:border-sky-400'
          }`;
          slotEl.dataset.slotIndex = slotIndex;

          if (slotItem) {
            slotEl.textContent = slotItem.char;
            slotEl.addEventListener('click', () => {
              if (this.isSolved) return;
              this.removeLetterFromSlot(slotIndex);
            });
          } else {
            slotEl.innerHTML = `<span class="text-sky-200 text-base sm:text-lg font-normal">${slotIndex + 1}</span>`;
          }

          slotEl.addEventListener('dragover', (e) => {
            e.preventDefault();
            slotEl.classList.add('bg-amber-100', 'border-amber-400');
          });
          slotEl.addEventListener('dragleave', () => {
            slotEl.classList.remove('bg-amber-100', 'border-amber-400');
          });
          slotEl.addEventListener('drop', (e) => {
            e.preventDefault();
            slotEl.classList.remove('bg-amber-100', 'border-amber-400');
            const poolId = parseInt(e.dataTransfer.getData('text/plain'), 10);
            if (!isNaN(poolId)) {
              this.placeLetterInSlot(poolId, slotIndex);
            }
          });

          this.dom.slotsContainer.appendChild(slotEl);
        });
      }

      renderPool() {
        this.dom.lettersPoolContainer.innerHTML = '';
        const isLong = this.letterPool.length > 5;
        const sizeClass = isLong
          ? "w-10 h-13 sm:w-12 sm:h-15 md:w-13 md:h-16 text-xl sm:text-2xl md:text-3xl rounded-xl sm:rounded-2xl"
          : "w-12 h-14 sm:w-14 sm:h-16 md:w-15 md:h-17 text-2xl sm:text-3xl md:text-4xl rounded-2xl";

        this.letterPool.forEach((item) => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = `${sizeClass} flex items-center justify-center font-extrabold shadow-lg transition-all duration-200 select-none ${
            item.used 
              ? 'opacity-20 pointer-events-none bg-slate-200 border-2 border-slate-300 text-slate-400 scale-90' 
              : 'bg-gradient-to-b from-sky-400 to-blue-500 text-white border-b-4 border-blue-700 active:border-b-0 active:translate-y-1 hover:scale-105 active:scale-95 cursor-grab'
          }`;
          card.textContent = item.char;
          card.dataset.poolId = item.id;
          card.draggable = !item.used && !this.isSolved;

          card.addEventListener('click', () => {
            if (item.used || this.isSolved) return;
            const emptySlotIndex = this.slots.findIndex(s => s === null);
            if (emptySlotIndex !== -1) {
              this.placeLetterInSlot(item.id, emptySlotIndex);
            } else {
              sfx.playTryAgain();
            }
          });

          card.addEventListener('dragstart', (e) => {
            if (item.used || this.isSolved) {
              e.preventDefault();
              return;
            }
            e.dataTransfer.setData('text/plain', item.id.toString());
            card.classList.add('opacity-50');
          });

          card.addEventListener('dragend', () => {
            card.classList.remove('opacity-50');
          });

          this.dom.lettersPoolContainer.appendChild(card);
        });
      }

      placeLetterInSlot(poolId, slotIndex) {
        const poolItem = this.letterPool.find(l => l.id === poolId);
        if (!poolItem || poolItem.used) return;

        if (this.slots[slotIndex]) {
          const oldPoolId = this.slots[slotIndex].poolId;
          const oldPoolItem = this.letterPool.find(l => l.id === oldPoolId);
          if (oldPoolItem) oldPoolItem.used = false;
        }

        poolItem.used = true;
        this.slots[slotIndex] = { char: poolItem.char, poolId: poolItem.id };
        sfx.playPop();

        this.renderBoard();
        this.checkIfComplete();
      }

      removeLetterFromSlot(slotIndex) {
        const slotItem = this.slots[slotIndex];
        if (!slotItem) return;

        const poolItem = this.letterPool.find(l => l.id === slotItem.poolId);
        if (poolItem) poolItem.used = false;

        this.slots[slotIndex] = null;
        sfx.playRemove();
        this.renderBoard();
      }

      resetCurrentBoard() {
        sfx.playRemove();
        this.letterPool.forEach(l => l.used = false);
        this.slots = new Array(this.getCurrentWord().word.length).fill(null);
        this.renderBoard();
      }

      giveHint() {
        if (this.isSolved) return;
        const currentWord = this.getDisplayWord(this.getCurrentWord());
        
        for (let i = 0; i < currentWord.length; i++) {
          const targetChar = currentWord[i];
          const currentSlot = this.slots[i];

          if (!currentSlot || currentSlot.char !== targetChar) {
            if (currentSlot) {
              this.removeLetterFromSlot(i);
            }

            let availablePoolItem = this.letterPool.find(l => l.char === targetChar && !l.used);
            if (!availablePoolItem) {
              const otherSlotIdx = this.slots.findIndex(s => s && s.char === targetChar);
              if (otherSlotIdx !== -1) {
                const borrowedPoolId = this.slots[otherSlotIdx].poolId;
                this.slots[otherSlotIdx] = null;
                availablePoolItem = this.letterPool.find(l => l.id === borrowedPoolId);
                availablePoolItem.used = false;
              }
            }

            if (availablePoolItem) {
              this.placeLetterInSlot(availablePoolItem.id, i);
              const slotElements = this.dom.slotsContainer.children;
              if (slotElements[i]) {
                slotElements[i].classList.add('ring-4', 'ring-emerald-400');
                setTimeout(() => slotElements[i]?.classList.remove('ring-4', 'ring-emerald-400'), 800);
              }
            }
            break;
          }
        }
      }

      checkIfComplete() {
        const isAllFilled = this.slots.every(s => s !== null);
        if (!isAllFilled) return;

        const currentWord = this.getDisplayWord(this.getCurrentWord());
        const assembledWord = this.slots.map(s => s.char).join('');

        if (assembledWord === currentWord) {
          this.handleSuccess();
        } else {
          this.handleFailure();
        }
      }

      handleSuccess() {
        this.isSolved = true;
        sfx.playSuccess();
        launchConfetti();

        const profile = this.profiles[this.currentUser];
        const word = this.getCurrentWord();
        const isFirstTime = !profile.completed[word.id];

        if (isFirstTime) {
          profile.stars += 1;
          profile.completed[word.id] = {
            date: new Date().toISOString(),
            times: 1
          };
        } else {
          profile.completed[word.id].times = (profile.completed[word.id].times || 1) + 1;
        }
        profile.history.push({
          word: word.word,
          success: true,
          time: new Date().toLocaleTimeString()
        });
        this.saveProfiles();
        this.renderProfile();
        this.renderCategoryTabs();

        const praiseTemplate = PRAISES[Math.floor(Math.random() * PRAISES.length)];
        const praiseEn = praiseTemplate.en.replace('{name}', this.currentUser);
        const praiseZh = praiseTemplate.zh.replace('{name}', this.currentUser);

        this.dom.feedbackEmoji.textContent = '🌟 🎉 🏆';
        this.dom.feedbackTitle.textContent = praiseZh;
        this.dom.feedbackSubtitle.textContent = praiseEn;
        this.dom.feedbackActionBtn.textContent = '挑戰下一個單字 ➡️';

        // 渲染單字強化複習區 (包含縮圖、正確拼字方塊、中文)
        if (this.dom.feedbackWordBox) {
          this.dom.feedbackWordBox.classList.remove('hidden');

          // 注入縮圖
          if (word.image && !word.image.startsWith('<svg') && !word.image.startsWith('data:')) {
            const fallback = word.fallbackImage || '';
            this.dom.feedbackWordImg.innerHTML = `<img src="${word.image}" alt="${word.translation}" onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.dataset.fb=''}else{this.onerror=null;}" data-fb="${fallback}" class="w-full h-full object-cover rounded-xl" />`;
          } else if (word.image && word.image.startsWith('data:image/svg+xml;utf8,')) {
            this.dom.feedbackWordImg.innerHTML = decodeURIComponent(word.image.replace('data:image/svg+xml;utf8,', ''));
          } else if (word.image && word.image.startsWith('<svg')) {
            this.dom.feedbackWordImg.innerHTML = word.image;
          } else if (word.image) {
            this.dom.feedbackWordImg.innerHTML = `<img src="${word.image}" alt="${word.translation}" class="w-full h-full object-cover rounded-xl" />`;
          }

          // 正確字母拼字方塊（預設小寫）
          const displayWord = this.getDisplayWord(word);
          this.dom.feedbackSpellingTiles.innerHTML = displayWord.split('').map(char => `
            <span class="inline-flex items-center justify-center w-7 h-8 sm:w-8 sm:h-9 rounded-lg bg-indigo-500 text-white font-black text-base sm:text-lg shadow-sm">${char}</span>
          `).join('');

          this.dom.feedbackWordText.textContent = displayWord;
          this.dom.feedbackWordTranslation.textContent = word.translation;
          this.dom.feedbackWordPhonics.textContent = word.phonics || '';
        }

        this.dom.feedbackCard.classList.remove('hidden');

        // 自動循序語音引導：
        // 1. 英文讚美 ("Awesome job, Tim!")
        // 2. 拼字發音 ("c - a - p, cap!")
        // 3. 中文發音 ("鴨舌帽")
        const currentToken = ++this.speechSequenceToken;
        setTimeout(() => {
          if (this.speechSequenceToken !== currentToken) return;
          this.speak(praiseEn, 0.95, () => {
            if (this.speechSequenceToken !== currentToken) return;
            setTimeout(() => {
              if (this.speechSequenceToken !== currentToken) return;
              this.speakSpelling(word.word, () => {
                if (this.speechSequenceToken !== currentToken) return;
                setTimeout(() => {
                  if (this.speechSequenceToken !== currentToken) return;
                  this.speakZh(word.translation);
                }, 350);
              });
            }, 350);
          });
        }, 400);
      }

      handleFailure() {
        sfx.playTryAgain();

        this.dom.slotsContainer.classList.add('animate-shake');
        setTimeout(() => {
          this.dom.slotsContainer.classList.remove('animate-shake');
        }, 600);

        const profile = this.profiles[this.currentUser];
        const word = this.getCurrentWord();
        profile.history.push({
          word: word.word,
          success: false,
          time: new Date().toLocaleTimeString()
        });
        this.saveProfiles();

        // 答錯時隱藏複習面板，專心打氣重試
        if (this.dom.feedbackWordBox) {
          this.dom.feedbackWordBox.classList.add('hidden');
        }

        const enc = ENCOURAGEMENTS[Math.floor(Math.random() * ENCOURAGEMENTS.length)];
        this.dom.feedbackEmoji.textContent = '💪 ✨ 🌱';
        this.dom.feedbackTitle.textContent = enc.zh;
        this.dom.feedbackSubtitle.textContent = enc.en;
        this.dom.feedbackActionBtn.textContent = '好，我再試一次！🔁';
        this.dom.feedbackCard.classList.remove('hidden');

        setTimeout(() => {
          this.speak(enc.en, 0.9);
        }, 300);
      }

      speak(text, rate = 0.9, onEnd = null) {
        if (!('speechSynthesis' in window)) {
          if (onEnd) onEnd();
          return;
        }
        try {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.rate = rate;
          utter.pitch = 1.05;
          utter.lang = 'en-US';

          const voices = window.speechSynthesis.getVoices();
          const naturalVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('Google')));
          if (naturalVoice) utter.voice = naturalVoice;

          if (onEnd) utter.onend = onEnd;
          window.speechSynthesis.speak(utter);
        } catch (e) {
          if (onEnd) onEnd();
        }
      }

      speakZh(text, onEnd = null) {
        if (!('speechSynthesis' in window)) {
          if (onEnd) onEnd();
          return;
        }
        try {
          const utter = new SpeechSynthesisUtterance(text);
          utter.rate = 0.85;
          utter.pitch = 1.05;
          utter.lang = 'zh-TW';

          const voices = window.speechSynthesis.getVoices();
          const zhVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('cmn') || v.name.includes('Taiwan') || v.name.includes('Mei-Jia') || v.name.includes('Han'));
          if (zhVoice) utter.voice = zhVoice;

          if (onEnd) utter.onend = onEnd;
          window.speechSynthesis.speak(utter);
        } catch (e) {
          if (onEnd) onEnd();
        }
      }

      speakSpelling(word, onEnd = null) {
        // 拼字發音：將每個字母分開清晰朗讀，最後念出完整單字
        const lettersSpelled = word.toUpperCase().split('').join(' , ');
        this.speak(`${lettersSpelled} . ${word}`, 0.75, onEnd);
      }

      prevWord() {
        sfx.playPop();
        this.loadWord(this.currentIndex - 1);
      }

      nextWord() {
        sfx.playPop();
        let nextIdx = this.currentIndex + 1;
        if (nextIdx >= this.words.length) {
          // 當一輪 15 題挑戰結束時，自動依據最新熟練度重新抽籤（10 熟 + 5 新）
          this.words = this.getWordsByCategory(this.currentCategory);
          nextIdx = 0;
        }
        this.loadWord(nextIdx);
      }

      showStats() {
        sfx.playPop();
        const profile = this.profiles[this.currentUser];
        const completedKeys = Object.keys(profile.completed);

        let html = `
          <div class="flex items-center gap-4 bg-amber-50 p-4 rounded-2xl mb-4 border border-amber-200">
            <div class="text-5xl">${profile.avatar}</div>
            <div>
              <h3 class="text-2xl font-black text-slate-800">${profile.name} 的成就單</h3>
              <p class="text-amber-600 font-bold text-lg">累積獲得 ⭐ ${profile.stars} 顆星星</p>
            </div>
          </div>

          <div class="mb-4">
            <div class="flex items-center justify-between mb-2">
              <h4 class="text-sm font-bold text-slate-600">已掌握單字統計</h4>
              <span class="text-xs font-black text-indigo-600 bg-indigo-50 px-2.5 py-0.5 rounded-full border border-indigo-200">${completedKeys.length} / ${this.allWords.length} 個</span>
            </div>
            <div class="space-y-3 max-h-64 overflow-y-auto pr-1">
        `;

        categories.forEach(cat => {
          const catWords = this.allWords.filter(w => w.category === cat.id);
          const doneWords = catWords.filter(w => !!profile.completed[w.id]);
          html += `
            <div class="bg-slate-50 rounded-2xl p-2.5 border border-slate-200">
              <div class="flex items-center justify-between text-xs font-black text-slate-700 mb-1.5 px-1">
                <span>${cat.icon} ${cat.name}</span>
                <span class="text-slate-500">${doneWords.length} / ${catWords.length}</span>
              </div>
              <div class="grid grid-cols-2 gap-1.5">
          `;
          catWords.forEach(w => {
            const isDone = !!profile.completed[w.id];
            const count = isDone ? (profile.completed[w.id].times || 1) : 0;
            html += `
              <div class="flex items-center gap-1.5 p-1.5 rounded-lg border text-xs ${isDone ? 'bg-emerald-50/80 border-emerald-200 text-emerald-800' : 'bg-white border-slate-200 text-slate-400 opacity-60'}">
                <span>${isDone ? '✅' : '⚪'}</span>
                <span class="font-extrabold">${this.getDisplayWord(w)}</span>
                <span class="text-[10px] text-slate-500">${w.translation}</span>
                ${isDone ? `<span class="ml-auto text-[10px] bg-emerald-200 text-emerald-800 px-1.5 py-0.2 rounded-full font-bold">x${count}</span>` : ''}
              </div>
            `;
          });
          html += `
              </div>
            </div>
          `;
        });

        html += `
            </div>
          </div>
          <div class="text-center pt-2">
            <button id="reset-user-progress-btn" class="text-xs text-red-400 hover:text-red-600 underline">重設 ${profile.name} 的歷史紀錄</button>
          </div>
        `;

        this.dom.statsList.innerHTML = html;

        document.getElementById('reset-user-progress-btn')?.addEventListener('click', () => {
          if (confirm(`確定要將 ${profile.name} 的紀錄歸零重新開始嗎？`)) {
            this.profiles[this.currentUser] = {
              name: profile.name,
              avatar: profile.avatar,
              stars: 0,
              completed: {},
              history: []
            };
            this.saveProfiles();
            this.renderProfile();
            this.renderCategoryTabs();
            this.showStats();
          }
        });

        this.dom.statsModal.classList.remove('hidden');
      }

      hideStats() {
        this.dom.statsModal.classList.add('hidden');
      }
    }

    // 強化啟動邏輯，確保在任何環境下皆能立即初始化
    function startApp() {
      try {
        window.app = new SpellingApp();
      } catch (err) {
        console.error("SpellingApp error:", err);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startApp);
    } else {
      startApp();
    }
  </script>
</body>
</html>
